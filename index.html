<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NX Plugin Usage Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="title-wrap">
        <h1>NX Plugin Usage Dashboard</h1>
        <p>先读取 TXT 文件名，再按所选 NX 工具分析数据</p>
      </div>
      <div class="actions">
        <button id="pick-folder-btn" class="primary">选择数据文件夹</button>
        <label class="fallback-upload" title="仅在不支持文件夹API时使用">
          <input id="folder-input" type="file" webkitdirectory directory multiple hidden />
          上传文件夹(兼容模式)
        </label>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2>NX 工具选择</h2>
          <input id="tool-search" type="text" placeholder="搜索工具名" />
          <div class="panel-row">
            <button id="select-all-tools" class="ghost">全选</button>
            <button id="clear-tools" class="ghost">清空</button>
          </div>
          <div id="tool-list" class="list-box empty">请先选择文件夹</div>
          <button id="analyze-tools" class="primary block">分析所选工具</button>
        </section>

        <section class="panel compact">
          <h2>筛选条件</h2>
          <label for="date-from">开始日期</label>
          <input id="date-from" type="date" />
          <label for="date-to">结束日期</label>
          <input id="date-to" type="date" />
          <button id="apply-filter" class="primary block">应用日期筛选</button>
        </section>
      </aside>

      <section class="content">
        <section class="status-bar panel">
          <div><strong>状态:</strong> <span id="status-text">等待加载数据</span></div>
          <div><strong>文件:</strong> <span id="file-progress">0 / 0</span></div>
          <div><strong>有效记录:</strong> <span id="valid-count">0</span></div>
          <div><strong>坏行:</strong> <span id="bad-count">0</span></div>
        </section>

        <section class="kpi-grid">
          <article class="kpi-card">
            <p>总记录数</p>
            <h3 id="kpi-total">0</h3>
          </article>
          <article class="kpi-card">
            <p>成功率</p>
            <h3 id="kpi-success-rate">0%</h3>
          </article>
          <article class="kpi-card">
            <p>成功平均时长</p>
            <h3 id="kpi-avg-duration">0 分钟</h3>
          </article>
          <article class="kpi-card">
            <p>活跃用户数</p>
            <h3 id="kpi-active-users">0</h3>
          </article>
          <article class="kpi-card">
            <p>P90 使用时长</p>
            <h3 id="kpi-p90-duration">0 分钟</h3>
          </article>
          <article class="kpi-card">
            <p>平均每日使用次数</p>
            <h3 id="kpi-daily-avg">0</h3>
          </article>
        </section>

        <section class="chart-grid">
          <article class="panel chart-panel">
            <h2>日使用频率</h2>
            <canvas id="daily-frequency-chart"></canvas>
          </article>
          <article class="panel chart-panel">
            <h2>工具成功率</h2>
            <canvas id="tool-success-chart"></canvas>
          </article>
          <article class="panel chart-panel">
            <h2>项目总时长 Top 10</h2>
            <canvas id="project-duration-chart"></canvas>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
